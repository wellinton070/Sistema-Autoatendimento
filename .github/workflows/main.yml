name: CI

on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v2  
      - run: pip install -r requirements.txt
      
      - name: Instalar dependências
        run: pip install pytest pytest-cov
      - name: Rodar testes
        run: pytest --cov=.
